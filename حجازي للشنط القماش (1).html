<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حجازي للشنط القماش</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2622;--mut:#7a716a;--ac:#c2410c;--acx:#fff;--ok:#15803d;--bd:#e7dfd5;--red:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1815;--card:#26221e;--tx:#f1ece6;--mut:#a39a91;--ac:#f97316;--acx:#1b1815;--ok:#4ade80;--bd:#3a342e;--red:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1815;--card:#26221e;--tx:#f1ece6;--mut:#a39a91;--ac:#f97316;--acx:#1b1815;--ok:#4ade80;--bd:#3a342e;--red:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;max-width:560px;margin-inline:auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:26px;font-weight:700}
.owe{color:var(--red)}.paid{color:var(--ok)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{background:transparent;color:var(--red);padding:4px 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btns button{flex:1}
input{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 8px}
label{font-size:14px;color:var(--mut)}
.item{padding:8px 0;border-top:1px solid var(--bd)}
.back{background:none;color:var(--ac);padding:0 0 8px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="hesabat_v1",D=[],cur=null,mode="";
try{D=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){D=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function n(x){return (Math.round(x*100)/100).toLocaleString("ar-EG")}
function tot(c){return c.items.reduce(function(s,i){return s+i.price*i.qty},0)}
function paidOf(c){return c.pays.reduce(function(s,p){return s+p.amt},0)}
function bal(c){return tot(c)-paidOf(c)}
function today(){return new Date().toLocaleDateString("ar-EG")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function get(id){return D.filter(function(c){return c.id===id})[0]}
function go(c,m){cur=c;mode=m||"";ES=-1;if(!c&&(m==="list"||m==="debt"))LM=m;render();window.scrollTo(0,0)}
function render(){
  var a=document.getElementById("app");
  if(!cur&&mode==="prices"){
    sortSizes();
    var es=ES>=0&&PR.sizes[ES]?PR.sizes[ES]:null;
    var p2="<button class='back' onclick='go(null)'>← رجوع</button><h1>قائمة الأسعار</h1><div class='card'><b>صورة قائمة الأسعار</b>";
    if(IE){p2+="<div class='owe'>"+IE+"</div>";IE=""}
    if(PR.img)p2+="<div style='overflow:auto;margin:8px 0'><img src='"+PR.img+"' style='width:100%;border-radius:10px' onclick='zoomImg(this)'></div><div class='mut'>اضغطي على الصورة لتكبيرها</div>";
    p2+="<label>"+(PR.img?"استبدال الصورة":"اختاري صورة من الفون")+"</label><input type='file' accept='image/*' onchange='upImg(this)'>"+(PR.img?"<button class='x' onclick='delImg()'>حذف الصورة</button>":"")+"</div>";
    p2+="<div class='card'><b>المقاسات والأسعار</b>";
    if(!PR.sizes.length)p2+="<div class='mut'>لسه مفيش مقاسات.</div>";
    PR.sizes.forEach(function(s,i){p2+="<div class='item row'><span>"+s.w+" × "+s.h+" = <b>"+n(s.price)+" جنيه</b></span><button class='x' onclick='editSize("+i+")'>تعديل</button><button class='x' onclick='delSize("+i+")'>حذف</button></div>"});
    p2+="<div class='item'><label>العرض</label><input id='sw' type='number' inputmode='decimal' value='"+(es?es.w:"")+"'><label>الطول</label><input id='sh' type='number' inputmode='decimal' value='"+(es?es.h:"")+"'><label>السعر</label><input id='sp' type='number' inputmode='decimal' value='"+(es?es.price:"")+"'><button onclick='addSize()'>"+(es?"حفظ التعديل":"إضافة المقاس")+"</button>"+(es?"<button class='s' onclick='cancelSize()'>إلغاء</button>":"")+"</div></div>";
    a.innerHTML=p2;return;
  }
  if(!cur&&mode==="debt"){
    var dl=D.filter(function(c){return bal(c)>0}).sort(function(x,y){return bal(y)-bal(x)});
    var g=dl.reduce(function(s,c){return s+bal(c)},0);
    var l2="<button class='back' onclick='go(null)'>← رجوع</button><h1>عليهم فلوس ("+dl.length+")</h1><div class='card'><div class='mut'>إجمالي المتبقي</div><div class='big owe'>"+n(g)+" جنيه</div></div>";
    if(!dl.length)l2+="<p class='mut'>مفيش حد عليه فلوس.</p>";
    dl.forEach(function(c){l2+="<div class='card' onclick=\"go('"+c.id+"')\"><div class='row'><b>"+esc(c.name)+"</b><span class='owe'>"+n(bal(c))+" جنيه</span></div></div>"});
    a.innerHTML=l2;return;
  }
  if(!cur&&mode==="list"){
    var l="<button class='back' onclick='go(null)'>← رجوع</button><h1>العملاء ("+D.length+")</h1>";
    if(!D.length)l+="<p class='mut'>لسه مفيش عملاء.</p>";
    D.forEach(function(c){var b=bal(c);l+="<div class='card' onclick=\"go('"+c.id+"')\"><div class='row'><b>"+esc(c.name)+"</b><span class='"+(b>0?"owe":"paid")+"'>"+n(b)+" جنيه</span></div></div>"});
    l+="<div class='btns'><button onclick=\"go('new','addc')\">+ إضافة عميل جديد</button></div>";
    a.innerHTML=l;return;
  }

function addClient(){var nm=document.getElementById("nm").value.trim();if(!nm)return;var id=uid();D.push({id:id,name:nm,phone:document.getElementById("ph").value.trim(),items:[],pays:[]});save();go(id)}
function addItem(){var c=get(cur),d=(document.getElementById("d").value.trim()||"شنطة")+sz(),p=parseFloat(document.getElementById("p").value),q=parseInt(document.getElementById("q").value,10);if(!(p>=0)||!(q>0))return alert("اكتبي السعر والعدد");c.items.push({id:uid(),desc:d,price:p,qty:q,date:today()});save();go(cur)}
function addPay(){var c=get(cur),a=parseFloat(document.getElementById("a").value);if(!(a>0))return alert("اكتبي المبلغ");c.pays.push({id:uid(),amt:a,kind:mode==="dep"?"عربون":"دفعة",date:today()});save();go(cur)}
function del(id,k){if(!confirm("متأكدة؟"))return;var c=get(cur);c[k]=c[k].filter(function(x){return x.id!==id});save();render()}
function delClient(){if(!confirm("حذف العميل وكل حساباته؟"))return;D=D.filter(function(c){return c.id!==cur});save();go(null,"list")}
function stmt(c){
  var t="كشف حساب: "+c.name+"\nالتاريخ: "+today()+"\n\nالطلبات:\n";
  c.items.forEach(function(i){t+="- "+i.desc+": "+i.qty+" × "+n(i.price)+" = "+n(i.qty*i.price)+" ("+i.date+")\n"});
  t+="\nإجمالي الطلبات: "+n(tot(c))+" جنيه\n\nالدفعات:\n";
  if(!c.pays.length)t+="- لا يوجد\n";
  c.pays.forEach(function(p){t+="- "+(p.kind==="عربون"?"عربون: ":"")+n(p.amt)+" جنيه ("+p.date+")\n"});
  t+="\nإجمالي المدفوع: "+n(paidOf(c))+" جنيه\nالمتبقي: "+n(bal(c))+" جنيه";
  return t;
}

async function pickFill(){var r=await pickPhone();if(r)document.getElementById("ph").value=r;else showCT()}
function qp(s){try{var b=s.replace(/=\r?\n/g,"").match(/=[0-9A-F]{2}|[^=]+/gi)||[],a=[];b.forEach(function(p){if(p[0]==="="&&p.length===3)a.push(parseInt(p.slice(1),16));else for(var i=0;i<p.length;i++)a.push(p.charCodeAt(i))});return new TextDecoder("utf-8").decode(new Uint8Array(a))}catch(e){return s}}
function vf(b,re){var m=b.match(re);if(!m)return "";return /QUOTED-PRINTABLE/i.test(m[1])?qp(m[2].trim()):m[2].trim()}
function importVcf(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var out=[];String(rd.result).split(/BEGIN:VCARD/i).forEach(function(b){var nm=vf(b,/^FN([^:\r\n]*):(.*)$/mi),tl=vf(b,/^(?:item\d+\.)?TEL([^:\r\n]*):(.*)$/mi);if(nm&&tl)out.push({n:nm,t:tl})});CT=out;try{localStorage.setItem("ct_v1",JSON.stringify(CT))}catch(e){}showCT()};rd.readAsText(f)}
function showCT(){var d=document.getElementById("cl");d.innerHTML="<div class='card'><input id='cq' placeholder='ابحثي بالاسم' oninput='filterCT()'><div id='cll'></div><label>تحديث جهات الاتصال من ملف vcf</label><input type='file' accept='.vcf,text/vcard,text/x-vcard,text/directory' onchange='importVcf(this)'></div>";filterCT()}
function filterCT(){var q=document.getElementById("cq").value.trim().toLowerCase(),h="",k=0;if(!CT.length)h="<div class='mut'>لسه مفيش جهات اتصال. اختاري ملف الجهات (vcf) من تحت.</div>";CT.forEach(function(c,i){if(k<30&&(!q||c.n.toLowerCase().indexOf(q)>-1)){k++;h+="<div class='item row' onclick='useCT("+i+")'><b>"+esc(c.n)+"</b><span class='mut'>"+esc(c.t)+"</span></div>"}});document.getElementById("cll").innerHTML=h}
function useCT(i){document.getElementById("ph").value=CT[i].t;var nm=document.getElementById("nm");if(nm&&!nm.value.trim())nm.value=CT[i].n;document.getElementById("cl").innerHTML=""}

function upImg(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,1400/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);var old=PR.img;PR.img=cv.toDataURL("image/jpeg",0.78);if(!savePR()){PR.img=old;IE="الصورة كبيرة ومش هتتحفظ، جربي صورة تانية"}render()};im.onerror=function(){IE="الصورة دي مش بتفتح، جربي صورة تانية";render()};im.src=rd.result};rd.readAsDataURL(f)}
function delImg(){PR.img=null;savePR();render()}
function addSize(){var w=parseFloat(document.getElementById("sw").value),h=parseFloat(document.getElementById("sh").value),p=parseFloat(document.getElementById("sp").value);if(!(w>0)||!(h>0)||!(p>=0))return;if(ES>=0&&PR.sizes[ES]){var t=PR.sizes[ES];t.w=w;t.h=h;t.price=p;ES=-1}else{var f=null;PR.sizes.forEach(function(s){if((s.w===w&&s.h===h)||(s.w===h&&s.h===w))f=s});if(f)f.price=p;else PR.sizes.push({w:w,h:h,price:p})}sortSizes();savePR();render()}
function sortSizes(){PR.sizes.sort(function(x,y){var a=Math.min(x.w,x.h),b=Math.min(y.w,y.h);return a-b||Math.max(x.w,x.h)-Math.max(y.w,y.h)})}
function delSize(i){ES=-1;PR.sizes.splice(i,1);savePR();render()}
function findPrice(w,h){for(var i=0;i<PR.sizes.length;i++){var s=PR.sizes[i];if((s.w===w&&s.h===h)||(s.w===h&&s.h===w))return s.price}return null}
function autoPrice(){var w=parseFloat(document.getElementById("ow").value),h=parseFloat(document.getElementById("oh").value),m=document.getElementById("pm");if(!(w>0)||!(h>0)){m.textContent="";return}var p=findPrice(w,h);if(p!==null){document.getElementById("p").value=p;m.textContent="السعر من قائمة الأسعار: "+n(p)+" جنيه"}else m.textContent="المقاس ده مش في قائمة الأسعار، اكتبي السعر بإيدك"}
function sz(){var w=document.getElementById("ow").value.trim(),h=document.getElementById("oh").value.trim();return w&&h?" "+w+"×"+h:""}
var ES=-1,EID="";
function editSize(i){ES=i;render();var e=document.getElementById("sw");if(e&&e.scrollIntoView)e.scrollIntoView()}
function cancelSize(){ES=-1;render()}
function startEdit(id,m){EID=id;go(cur,m)}
function editClient(){go(cur,"editc")}
function editForm(c){var f="<div class='card'>";var bt="<div class='btns'><button onclick='saveEdit()'>حفظ التعديل</button><button class='s' onclick='go(cur)'>إلغاء</button></div>";
  if(mode==="editc")f+="<b>تعديل بيانات العميل</b><label>الاسم</label><input id='en' value='"+esc(c.name)+"'><label>واتساب</label><input id='ep' type='tel' value='"+esc(c.phone||"")+"'>"+bt;
  else if(mode==="edititem"){var it=c.items.filter(function(x){return x.id===EID})[0]||{desc:"",price:"",qty:""};f+="<b>تعديل الطلبية</b><label>نوع الشنطة (ومعاها المقاس)</label><input id='ed' value='"+esc(it.desc)+"'><label>السعر (للقطعة)</label><input id='epr' type='number' inputmode='decimal' value='"+it.price+"'><label>العدد</label><input id='eq' type='number' inputmode='numeric' value='"+it.qty+"'>"+bt}
  else{var pp=c.pays.filter(function(x){return x.id===EID})[0]||{amt:""};f+="<b>تعديل الدفعة</b><label>المبلغ</label><input id='ea' type='number' inputmode='decimal' value='"+pp.amt+"'>"+bt}
  return f+"</div>"}
function saveEdit(){var c=get(cur);
  if(mode==="editc"){var nm=document.getElementById("en").value.trim();if(!nm)return;c.name=nm;c.phone=document.getElementById("ep").value.trim()}
  else if(mode==="edititem"){var it=c.items.filter(function(x){return x.id===EID})[0],p=parseFloat(document.getElementById("epr").value),q=parseInt(document.getElementById("eq").value,10);if(!it||!(p>=0)||!(q>0))return;it.desc=document.getElementById("ed").value.trim()||it.desc;it.price=p;it.qty=q}
  else{var pp=c.pays.filter(function(x){return x.id===EID})[0],a=parseFloat(document.getElementById("ea").value);if(!pp||!(a>0))return;pp.amt=a}
  save();go(cur)}
var LM="list";
function goList(){go(null,LM)}
function setPhone(v){var c=get(cur);c.phone=v.trim();save()}
async function pickPhone(){
  try{
    if(navigator.contacts&&navigator.contacts.select){
      var r=await navigator.contacts.select(["tel"],{multiple:false});
      return (r&&r[0]&&r[0].tel&&r[0].tel[0])||null;
    }
  }catch(e){}
  return null;
}
async function share(){
  var c=get(cur),t=stmt(c),ph=(c.phone||"").replace(/\D/g,"");
  if(!ph){var r=await pickPhone();if(r){c.phone=r;save();ph=r.replace(/\D/g,"")}}
  if(ph.indexOf("00")===0)ph=ph.slice(2);else if(ph.indexOf("0")===0)ph="20"+ph.slice(1);
  var u="https://wa.me/"+ph+"?text="+encodeURIComponent(t);
  var w=window.open(u,"_blank");if(!w)location.href=u;
}
async function editPhone(){var c=get(cur),r=await pickPhone();if(!r)return;c.phone=r.trim();save();render()}
render();
